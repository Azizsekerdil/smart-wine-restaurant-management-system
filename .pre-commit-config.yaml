# Wine House — commit öncesi denetimler
# Kurulum:  .venv\Scripts\pre-commit.exe install
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-json
        exclude: ^docs/sbom/
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^src/static/vendor/
      - id: trailing-whitespace
        exclude: ^src/static/vendor/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.(bat|cmd|ps1)$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: ^(docs/sbom/|src/static/vendor/)
