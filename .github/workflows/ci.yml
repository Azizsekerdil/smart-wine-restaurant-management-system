name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  # Tests use their own settings profile and need no secrets.
  DJANGO_SETTINGS_MODULE: winehouse.settings.test

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        # setuptools is upgraded explicitly: the version bundled with the
        # runner's virtualenv can carry known advisories that have nothing to
        # do with this project's declared dependencies.
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Tests and coverage
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      - name: Ruff (lint + import order)
        run: ruff check src tests scripts

      - name: Black (format check)
        run: black --check src tests

      - name: mypy (type check)
        run: mypy src
        continue-on-error: true

  security:
    name: Security and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Secret scan (detect-secrets)
        run: |
          detect-secrets scan \
            --exclude-files '\.venv/|var/|\.git/|staticfiles/|docs/presentation/|src/static/fonts/' \
            > .secrets.new
          python - <<'PY'
          import json, sys
          results = json.load(open(".secrets.new")).get("results", {})
          total = sum(len(v) for v in results.values())
          print("detect-secrets findings:", total)
          for path, items in results.items():
              for item in items:
                  print(f"  {path}:{item.get('line_number')} {item.get('type')}")
          sys.exit(1 if total else 0)
          PY

      - name: Known vulnerabilities (runtime dependencies)
        # The runtime set is the one shipped to users and must stay clean.
        run: pip-audit --strict -r requirements.txt

      - name: Known vulnerabilities (development dependencies)
        run: pip-audit --strict -r requirements-dev.txt

      - name: Static security analysis
        run: bandit -r src scripts --severity-level medium --exclude '*/migrations/*'

      - name: Dependency licences
        run: |
          pip-licenses --from=mixed --format=markdown --output-file=dependency-licenses.md
          cat dependency-licenses.md

      - name: Licence gate (classified scan + SPDX)
        run: python manage.py license_scan --gate

      - name: Privacy gate (PII inventory diff)
        run: python manage.py privacy_scan --gate

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json

      - name: Scan SBOM for vulnerabilities (Grype)
        uses: anchore/scan-action@v6
        with:
          path: .
          fail-build: true
          severity-cutoff: high
